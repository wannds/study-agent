[package]
name = "study-agent"
version = "0.12.0"
edition = "2021"
license = "MIT"
description = "A local-first learning workspace with a Rust agent backend"
default-run = "study-agent"

[[bin]]
name = "study-agent"
path = "src/main.rs"

[[bin]]
name = "study-agent-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tao", "dep:wry", "dep:open"]

[dependencies]
base64 = "0.22"
c2m-source = { path = "vendor/course2md-engine/crates/c2m-source" }
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tao = { version = "0.37.2", optional = true }
wry = { version = "0.57.2", optional = true }
open = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[dev-dependencies]
ureq = { version = "3.5.2", features = ["native-tls"] }

